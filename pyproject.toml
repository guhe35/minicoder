[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicoder-agent"
version = "0.1.0"
description = "A small coding agent implemented without agent frameworks"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
minicoder = "minicoder.cli:main"
minicoder-web = "minicoder.web:main"

[tool.setuptools.packages.find]
include = ["minicoder*"]

[tool.setuptools.package-data]
minicoder = ["web_static/*"]

